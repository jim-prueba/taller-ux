<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Biblioteca - Registro</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <main class="tarjeta">
      <h1>Registro de Libros - Biblioteca</h1>
      <p class="ayuda">
        Complete los datos del ejemplar. Todos los campos son obligatorios.
      </p>

      <form id="form-biblioteca" novalidate>
        <fieldset>
          <legend>Datos del Libro</legend>

          <label for="titulo">Título del Libro</label>
          <input
            id="titulo"
            type="text"
            placeholder="Ej. La ciudad y los perros"
            required
          />

          <label for="autor">Autor</label>
          <input
            id="autor"
            type="text"
            placeholder="Ej. Mario Vargas Llosa"
            required
          />

          <label for="categoria">Categoría</label>
          <select id="categoria" required>
            <option value="">Seleccione una categoría</option>
            <option value="Literatura">Literatura</option>
            <option value="Tecnología">Tecnología</option>
            <option value="Ciencias">Ciencias</option>
          </select>
        </fieldset>

        <p id="mensaje" class="mensaje" role="status"></p>

        <div class="acciones">
          <button type="submit" class="boton-principal">Guardar Libro</button>
          <button type="reset" class="boton-secundario">
            Limpiar Formulario
          </button>
        </div>
      </form>
    </main>
    <script src="app.js"></script>
  </body>
</html>
